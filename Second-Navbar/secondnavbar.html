<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meniscus — Dock Navbar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="glow-bg"></div>

    <main class="stage">
      <header class="hero">
        <p class="eyebrow"><span class="dot"></span>Meniscus</p>
        <h1 id="heroTitle">Home</h1>
        <p class="hero-sub" id="heroSub">Everything, on one surface.</p>
      </header>

      <div class="dock-wrap" id="dockWrap">
        <svg class="dock" id="dockSvg" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="mnPlate" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#2b2846" />
              <stop offset="1" stop-color="#1a1830" />
            </linearGradient>
            <linearGradient id="mnRim" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="rgba(255,255,255,0.16)" />
              <stop offset="1" stop-color="rgba(255,255,255,0.02)" />
            </linearGradient>
          </defs>
          <path class="dock__fill" id="dockPath" d=""></path>
        </svg>

        <div class="tabs" id="tabs" role="tablist">
          <button
            class="tab is-active"
            role="tab"
            data-tab="home"
            aria-selected="true"
          >
            <svg
              class="tab__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
              <path d="M9 22V12h6v10" />
            </svg>
          </button>
          <button class="tab" role="tab" data-tab="profile">
            <svg
              class="tab__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </button>
          <button class="tab" role="tab" data-tab="messages">
            <svg
              class="tab__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
              />
            </svg>
          </button>
          <button class="tab" role="tab" data-tab="camera">
            <svg
              class="tab__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"
              />
              <circle cx="12" cy="13" r="4" />
            </svg>
          </button>
          <button class="tab" role="tab" data-tab="settings">
            <svg
              class="tab__icon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="4" y1="21" x2="4" y2="14" />
              <line x1="4" y1="10" x2="4" y2="3" />
              <line x1="12" y1="21" x2="12" y2="12" />
              <line x1="12" y1="8" x2="12" y2="3" />
              <line x1="20" y1="21" x2="20" y2="16" />
              <line x1="20" y1="12" x2="20" y2="3" />
              <line x1="1" y1="14" x2="7" y2="14" />
              <line x1="9" y1="8" x2="15" y2="8" />
              <line x1="17" y1="16" x2="23" y2="16" />
            </svg>
          </button>
        </div>

        <button
          class="bead"
          id="bead"
          aria-label="Faol bo'lim, sudrab siljitish mumkin"
        >
          <svg
            class="bead__icon"
            id="beadIcon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="#20240a"
            stroke-width="2.2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <path d="M9 22V12h6v10" />
          </svg>
        </button>

        <div class="tab-label" id="tabLabel">Home</div>
      </div>

      <p class="hint">
        Tab bosing — yoki <span class="hint__accent">bead'ni sudrab</span> bar
        bo'ylab siljiting.
      </p>
    </main>

    <script src="app.js"></script>
  </body>
</html>
